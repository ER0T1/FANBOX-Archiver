name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and browser GUI
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "true"
      FANBOX_E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install chromium
          npm ci
      - name: Validate project versions
        shell: powershell
        run: npm run release:check
      - name: TypeScript and Node tests
        run: npm run test:web
      - name: Python tests
        run: python -m pytest -m "not e2e"
      - name: Browser GUI E2E
        run: npm run test:e2e

  desktop:
    name: Tauri sidecar and NSIS
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          npm ci
      - name: Build and test Python sidecar
        shell: pwsh
        run: |
          npm run desktop:sidecar
          npm run desktop:test-sidecar
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build NSIS installer
        run: npx tauri build --ci
      - name: Test installer lifecycle
        shell: powershell
        run: npm run desktop:test-installer
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fanbox-archiver-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
