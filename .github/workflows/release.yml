name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Signed Windows release
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CI: "true"
      FANBOX_E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,test]"
          python -m playwright install chromium
          npm ci
      - name: Validate release version
        shell: powershell
        run: ./scripts/check-version.ps1 -ExpectedVersion "${{ github.ref_name }}"
      - name: Run release tests
        shell: pwsh
        run: |
          npm run test:web
          python -m pytest -m "not e2e"
          npm run test:e2e
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build and verify signed release
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/build-release.ps1 -Tag "${{ github.ref_name }}"
      - name: Test signed installer lifecycle
        shell: powershell
        run: |
          npm run desktop:test-sidecar
          npm run desktop:test-installer
      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanbox-archiver-${{ github.ref_name }}-windows
          path: build/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem -LiteralPath build/release -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "FANBOX Archiver ${{ github.ref_name }}" $Assets

