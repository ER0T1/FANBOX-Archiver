auth:
  profile_dir: "./.fanbox-browser"
  browser_channel: chrome
storage:
  output_dir: "./FANBOX"
  database: "./FANBOX/backup.db"
download:
  original_images: true
  download_attachments: true
  download_cover: true
  max_concurrent: 1
  retry_count: 3
  request_interval_seconds: 3
  resume: true
  verify_sha256: true
  timeout_seconds: 60
markdown:
  enabled: true
  yaml_front_matter: true
  relative_image_paths: true
  preserve_original_order: true
sync:
  skip_completed: true
  check_updates: true
  preserve_deleted_posts: true
  max_posts_per_run: 20
  supporting_only: true
  rotate_creators: true
  recent_unchanged_stop_count: 20
backup_defaults:
  dry_run: false
  include_profile: true
  include_fancard: true
schedule:
  enabled: false
  frequency: daily
  interval: 1
  weekday: 0
  month_day: 1
  time: "00:00"
  start_date: null
  creators: []
  power: no_wake_battery_ok
display:
  timezone: system
  theme: system
  # 介面語言：auto（跟隨系統，找不到支援語言時用 English）、zh-Hant、en、ja 或 ko；qps-ploc 為版面測試用語系。
  language: auto
  colors:
    light: {}
    dark: {}
logging:
  level: INFO
  write_to_file: true
  keep_days: 30
