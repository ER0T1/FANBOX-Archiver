<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FANBOX Archive</title>
  <meta name="fanbox-session-token" content="__FANBOX_SESSION_TOKEN__">
  <link rel="stylesheet" href="/assets/app-v2.css">
  <link rel="stylesheet" href="/assets/design-tokens.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">FANBOX Archive</a>
    <nav id="nav" aria-label="主要導覽">
      <button type="button" data-view="posts">投稿</button>
      <button type="button" data-view="creators">創作者</button>
      <button type="button" data-view="backup">備份</button>
      <button type="button" data-view="maintenance">維護</button>
      <button type="button" data-view="settings">設定</button>
    </nav>
    <input id="search" type="search" placeholder="搜尋標題或 Post ID…" aria-label="搜尋文章">
    <span id="connection" class="status">本機</span>
  </header>
  <main id="app" aria-live="polite"><p class="empty">正在讀取封存…</p></main>
  <script src="/assets/core.js" defer></script>
</body>
</html>
