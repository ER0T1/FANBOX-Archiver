[package]
name = "fanbox-archiver-desktop"
version = "1.3.5"
description = "Desktop GUI for the local FANBOX Archiver"
authors = ["FANBOX Archiver contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fanbox_archiver_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rfd = "0.17.2"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.6.0"
