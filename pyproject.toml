[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fanbox-archiver"
version = "1.3.9"
description = "A conservative, local pixivFANBOX backup CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "browser-cookie3>=0.20,<1",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "markdownify>=0.13,<2",
  "Pillow>=10,<13",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-httpx>=0.30,<1"]
desktop = ["pyinstaller>=6.16,<7"]

[project.scripts]
fanbox-archiver = "fanbox_archiver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fanbox_archiver"]

[tool.hatch.build.targets.wheel.force-include]
"src/fanbox_archiver/site_assets" = "fanbox_archiver/site_assets"
"src/fanbox_archiver/web_assets" = "fanbox_archiver/web_assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: launches a local browser against an isolated live GUI server"]

